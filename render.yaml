services:
  - type: web
    name: emaqhinebeni-braai
    env: node
    buildCommand: npm install
    startCommand: npm start
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: APP_URL
        value: https://emaqhinebeni-braai.onrender.com
      - key: SESSION_SECRET
        generateValue: true
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: ADMIN_EMAIL
        sync: false 